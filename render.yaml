services:
  - type: web
    name: analyse-comptable
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run FinalBalanceF.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "200"
    plan: free
